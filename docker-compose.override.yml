services:
    app:
        environment:
            DATABASE_URL: 'sqlserver://db:1433;database=${MSSQL_DB};user=sa;password=${MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true'
        command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            ACCEPT_EULA: 'Y'
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
            MSSQL_DB: ${MSSQL_DB}
            MSSQL_PID: Developer
        ports:
            - '${MSSQL_PORT:-1433}:1433'
        volumes:
            - mssql-data:/var/opt/mssql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        restart: unless-stopped

volumes:
    mssql-data:

variables:
  HARBOR_REGISTRY: "harbor.adata.com"
  GITOPS_REPO_HOST: "gitlab.adata.com"
  GITOPS_REPO_PATH: "adata/devops/gitops-manifests"
  GITOPS_APP_PATH: "clusters/sao-paulo/apps/tecthus/tmdb/backend"
  IMAGE: "$HARBOR_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  tags: ["k8s-sp"]
  image:
    name: harbor.adata.com/gcr/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"auth\":\"$HARBOR_AUTH_B64\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --dockerfile .adata/Dockerfile
      --context .
      --destination $IMAGE
      --skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"

update-gitops:
  stage: deploy
  tags: ["k8s-sp"]
  image: harbor.adata.com/dockerhub/library/alpine:3.19
  needs: ["build"]
  before_script:
    - apk add --no-cache git curl
  script:
    - |
      for i in 1 2 3 4 5; do
        rm -rf /tmp/gitops
        git clone --branch main "https://${GITOPS_CI_USERNAME}:${GITOPS_CI_PASSWORD}@${GITOPS_REPO_HOST}/${GITOPS_REPO_PATH}.git" /tmp/gitops
        cd /tmp/gitops
        sed -i "s#^\( *image: \).*#\1${IMAGE}#" "${GITOPS_APP_PATH}/${CI_COMMIT_BRANCH}/manifests.yaml"
        git config user.email "ci@adata.com"
        git config user.name "GitLab CI (tecthus/tmdb/backend)"
        git commit -am "tecthus/tmdb/backend - bump imagem pra ${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}" || { echo "sem mudanca"; break; }
        if git push origin HEAD:main; then
          echo "push ok"
          break
        fi
        echo "push falhou (provavel non-fast-forward), tentativa $i de 5, tentando de novo..."
        cd /
        sleep $((i*3))
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"

verify:
  stage: notification
  tags: ["k8s-sp"]
  image: harbor.adata.com/dockerhub/library/alpine:3.19
  needs: ["update-gitops"]
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      APP_NAME="${CI_COMMIT_BRANCH}-tmdb-backend"
      for i in $(seq 1 30); do
        RESP=$(curl -sk -H "Authorization: Bearer ${KUBE_CI_TOKEN_ADATA_SP}" "${KUBE_API_URL_ADATA_SP}/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/${APP_NAME}" || echo '{}')
        SYNC=$(echo "$RESP" | jq -r '.status.sync.status // "Unknown"')
        HEALTH=$(echo "$RESP" | jq -r '.status.health.status // "Unknown"')
        echo "tentativa $i/30: sync=$SYNC health=$HEALTH"
        if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
          exit 0
        fi
        sleep 10
      done
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "prod"

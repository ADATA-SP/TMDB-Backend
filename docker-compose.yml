version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: .build/Dockerfile
        volumes:
            - .:/app
        ports:
            - '3001:3001'
        environment:
            NODE_ENV: development
            DATABASE_URL: 'sqlserver://172.100.11.112:1434;database=adata_rms2_dev;user={rms2devapp};password={apprms2@2025};encrypt=true;trustServerCertificate=true'
            APP_ENV: 'local'
            APP_PORT: '3001'
            APP_VERSION: 'RMS2 Backend v1.0.0'

            CORS_ORIGIN: '*'
            CORS_METHODS: 'GET,HEAD,PUT,PATCH,POST,DELETE'
            CORS_PREFLIGHT: 'false'
            CORS_SUSS_STATUS: '204'

            SWAGGER_TITLE: 'RMS2'
            SWAGGER_DESCRIPTION: 'RMS2 - Documentation'
            SWAGGER_VERSION: '1.0'
            SWAGGER_ENDPOINT: 'swagger'
            SWAGGER_API_URL: 'http://localhost:3001'

            JWT_AT_SECRET: 'at-secret'
            JWT_AT_EXPIRES: '12h'

            LDAP_SERVER: 'ldap://172.100.10.48:389'
            LDAP_BASE: 'DC=conecthus,DC=ORG,DC=BR'
            LDAP_USER: 'qwsadata'
            LDAP_PASSWORD: 'nEdaswixo@23'
            LDAP_ATTRIBUTE: 'sAMAccountName'

            MAIL_HOST: 'smtp.office365.com'
            MAIL_PORT: '587'
            MAIL_TEXT: 'simip'
            MAIL_FROM: 'no-reply@conecthus.org.br'
            MAIL_AUTH_USER: 'no-reply@conecthus.org.br'
            MAIL_AUTH_PASS: 'itbam*2023'

            REDIS_HOST: redis
            REDIS_PORT: '6379'
            REDIS_PASSWORD: 'qweQWE123'
        depends_on:
            - redis
    redis:
        image: 'redis:latest'
        container_name: 'redis-rms'
        environment:
            REDIS_PASSWORD: root
        ports:
            - '6379:6379'
        command: /bin/sh -c 'redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}'

stages:
  - test
  - deploy

análise de código fonte:
  stage: test
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  cache:
    key: '${CI_JOB_NAME}'
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.qualitygate.wait=true
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.sources=.
      -Dsonar.projectBaseDir=.
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.scm.provider=git
      -Dsonar.exclusions=node_modules
      -Dsonar.test.exclusions=node_modules
      -Dsonar.cpd.exclusions=node_modules
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.projectName=$CI_PROJECT_PATH
  allow_failure: false
  only:
    - main

deploy amb. de desenvolvimento:
  variables:
    REPO_ENV: 'dev'
  stage: deploy
  script:
    - git clone https://$GL_USER:$GL_TOKEN@gitlab.conecthus.org.br/environment/cicd.git
    - docker buildx build --build-arg NODE_ENV=$REPO_ENV -t "$REGISTRY_HOST_URL/$CI_PROJECT_PATH:$REPO_ENV" -f ./cicd/Dockerfile.node22.18.pnpm.nest --push .
    - ds-updater $CI_PROJECT_PATH:$REPO_ENV
  allow_failure: false
  only:
    - dev

deploy amb. de teste:
  variables:
    REPO_ENV: 'test'
  stage: deploy
  script:
    - git clone https://$GL_USER:$GL_TOKEN@gitlab.conecthus.org.br/environment/cicd.git
    - docker buildx build --build-arg NODE_ENV=$REPO_ENV -t "$REGISTRY_HOST_URL/$CI_PROJECT_PATH:$REPO_ENV" -f ./cicd/Dockerfile.node22.18.pnpm.nest --push .
    - ds-updater $CI_PROJECT_PATH:$REPO_ENV
  allow_failure: false
  only:
    - test

deploy amb. de produção:
  variables:
    REPO_ENV: 'main'
  stage: deploy
  script:
    - git clone https://$GL_USER:$GL_TOKEN@gitlab.conecthus.org.br/environment/cicd.git
    - docker buildx build --build-arg NODE_ENV=$REPO_ENV -t "$REGISTRY_HOST_URL/$CI_PROJECT_PATH:$REPO_ENV" -f ./cicd/Dockerfile.node22.18.pnpm.nest --push .
    - ds-updater $CI_PROJECT_PATH:$REPO_ENV
  allow_failure: false
  only:
    - main